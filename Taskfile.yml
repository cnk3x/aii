version: "3"

vars:
    NAME: aii
    OUT: bin/{{.NAME}}
    CONFIG: config.json
    GOBUILD: go build -buildvcs=false -trimpath -ldflags="-s -w"

tasks:
    default:
        cmds: [task: build]

    build:
        cmds:
            - GOOS=linux GOARCH=amd64 {{.GOBUILD}} -o {{.OUT}}-linux-amd64 ./
            - GOOS=linux GOARCH=arm64 {{.GOBUILD}} -o {{.OUT}}-linux-arm64 ./
            - GOOS=windows GOARCH=arm64 {{.GOBUILD}} -o {{.OUT}}.exe ./

    docker:
        deps:
            - build
        cmds:
            - "wsl docker build --progress plain -t cnk3x/{{.NAME}}:latest --platform linux/amd64,linux/arm64 ."

    push:
        deps:
            - build
        cmds:
            - "wsl docker build --progress plain -t cnk3x/{{.NAME}}:latest --platform linux/amd64,linux/arm64 ."
