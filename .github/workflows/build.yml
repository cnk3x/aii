name: Build

on:
  # push: { branches: ["main"] }
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: "1.27.1", cache: true }

      - name: gobuild-linux-amd64
        run: go build -buildvcs=false -trimpath -ldflags="-s -w" -o bin/aii-linux-amd64 ./
        env: { GOOS: linux, GOARCH: amd64 }

      - name: gobuild-linux-arm64
        run: go build -buildvcs=false -trimpath -ldflags="-s -w" -o bin/aii-linux-arm64 ./
        env: { GOOS: linux, GOARCH: arm64 }

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker images
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
